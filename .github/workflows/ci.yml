name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test CLI and installer
        run: make test
      - name: Build pinned controller backend
        run: make backend
      - name: Check static release binary
        run: |
          test -x ugreen_leds_cli
          file ugreen_leds_cli | grep -q 'statically linked'

